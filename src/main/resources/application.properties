server.port=${PORT:8080}

spring.application.name=happy-nest-pg-backend

# Local PostgreSQL (ignored on Render when DATABASE_URL is set)
spring.datasource.url=jdbc:postgresql://localhost:5432/happy_nest
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Seed rooms/beds on first empty start
app.seed-building=true

# Fixed admin login (override with env on Render)
app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password=${APP_AUTH_PASSWORD:happynest@602}
app.auth.admin-name=${APP_AUTH_ADMIN_NAME:Admin}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app,https://happy-nest-pg-frontend.vercel.app}

# Spring AI — OpenAI-compatible. Default is Groq (fast). Set AI_API_KEY on Render.
spring.ai.openai.api-key=${AI_API_KEY:not-set}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${AI_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.options.temperature=0.2
app.ai.api-key=${AI_API_KEY:not-set}

