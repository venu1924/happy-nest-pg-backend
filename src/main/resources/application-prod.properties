server.port=${PORT:8080}

# In production, DATABASE_URL (Render) must be set.
# Localhost defaults from application.properties must NOT be used.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://MISSING_SET_DATABASE_URL_ON_RENDER:5432/missing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:missing}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:missing}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.seed-building=true

app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password=${APP_AUTH_PASSWORD:happynest@602}
app.auth.admin-name=${APP_AUTH_ADMIN_NAME:Admin}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

logging.level.root=INFO
logging.level.com.happynest=INFO
