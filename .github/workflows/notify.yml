name: Send phone alerts

on:
  schedule:
    # 9:00 AM and 7:00 PM India time. Wakes the server so alerts go out
    # even when nobody has the app open.
    - cron: '30 3 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API and send the due alerts
        run: |
          curl --fail --retry 6 --retry-all-errors --retry-delay 20 --max-time 180 \
            "https://happy-nest-pg-backend-bpbp.onrender.com/api/notifications/dispatch"
