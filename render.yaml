services:
  - type: web
    name: happy-nest-pg-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: happy-nest-db
          property: connectionString
      - key: APP_AUTH_USERNAME
        value: admin
      - key: APP_AUTH_PASSWORD
        value: happynest@602
      - key: APP_AUTH_ADMIN_NAME
        value: Admin
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_OPTS
        value: -Xmx400m

databases:
  - name: happy-nest-db
    plan: free
    databaseName: happy_nest
    user: happynest
